<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
	body {

 background-image:url(../lg.avif) ;
 margin: 0px;
}
main li {
 font-size: 50px;
color: white;
margin: 20px;
font-family: impact;
}

nav ul {
list-style-type: none;
margin: 0px;
padding: 0px;
overflow: hidden;
background-color: darkblue;
}
nav li {

float: left;

}

nav li a {

display: block;
color: white;
text-align: center;
padding: 16px;
text-decoration: none;
}

nav li :hover{
background-color: white;
color:black;

} 
h1{
 text-align: center;
 font-size: 70px;
 font-family: cursive;
 color: green;
}
h1{
    text-align: center;
    font-size: 60px;
    font-family: cursive;
    color: darkgreen;
    text-shadow: 2px 2px 8px black;
}

form{
    width: 420px;
    margin: 40px auto;
    padding: 30px;
    background: rgba(0,0,0,0.75);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

form label{
    color: white;
    font-size: 18px;
    font-weight: bold;
}

form input{
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 18px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

form input:focus{
    outline: none;
    box-shadow: 0 0 10px #00ff66;
}

input[type="submit"]{
    background: #00cc44;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

input[type="submit"]:hover{
    background: #009933;
    transform: scale(1.05);
}
</style>

</head>

 <header>

 <h1>CONTACT US</h1>


<form>
 <label for="firstName"> First Name:</label> <br>

			<label for="lastname">Last Name:</label> <br>
		<input type="text" name="lastname" id="lastname" > <br>
			<label for="email"> E-mail:</label> <br>
		<input type="email" name="email" required size="34"> <br> 
			<label for="password">Password:</label> <br>

        <input type="submit" value="Submit">

</form>
